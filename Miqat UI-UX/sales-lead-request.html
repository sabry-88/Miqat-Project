<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب إضافة عميل جديد | ميقات للمبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page">
  <a href="#main-content" class="skip-link" data-i18n="partner_hub.skip_link">تخطي إلى المحتوى الرئيسي</a>
  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap"><a href="sales-customers.html" class="acc-brand-link"><img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="40" height="40"><img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="40" height="40"><div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="sales_crm.brand_title">ميقات للمبيعات ومركز الاتصال</span></div></a></div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="sls-lang-switcher" aria-label="Switch Language"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="sls-theme-toggle" aria-label="Switch Theme"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle></svg></button>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper" style="display:block;">
    <main class="acc-main-content" id="main-content" role="main" style="max-width:740px; margin-inline:auto;">
      <section class="sls-card" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="acc-page-title" data-i18n="sales_crm.lead_req_title">طلب إضافة عميل (إحالة للإدارة)</h1>
          <p class="sls-card-desc" data-i18n="sales_crm.lead_req_desc">يتم إرسال الطلب للإدارة للاعتماد والتعيين — لا يتم التعيين الذاتي تلقائياً.</p>
        </div>
        <a href="sales-customers.html" class="acc-btn acc-btn-secondary acc-btn-sm" data-i18n="sales_crm.back_to_customers">العودة</a>
      </section>

      <section class="sls-card">
        <div id="lr-status" class="sls-item-meta" role="status" hidden></div>
        <form id="lr-form" style="display:flex; flex-direction:column; gap:0.85rem;">
          <input type="text" id="lr-name" class="acc-filter-input" required placeholder="الاسم الكامل / Full Name">
          <input type="tel" id="lr-phone" class="acc-filter-input" required placeholder="010xxxxxxxx">
          <input type="tel" id="lr-wa" class="acc-filter-input" placeholder="WhatsApp">
          <select id="lr-gov" class="acc-filter-select">
            <option value="cairo">Cairo / القاهرة</option>
            <option value="portsaid">Port Said / بورسعيد</option>
            <option value="other_gov">Other / محافظات أخرى</option>
            <option value="overseas">Overseas / بالخارج</option>
          </select>
          <select id="lr-prog" class="acc-filter-select">
            <option value="PRG-UMR-RAJAB">Makkah Elite Rajab Umrah</option>
            <option value="PRG-UMR-SHABAN">Shaban 5-Star Umrah</option>
            <option value="PRG-HAJJ-ECO">Economy Hajj 2026</option>
            <option value="PRG-UMR-RAMADAN">Ramadan Last 10 Days</option>
            <option value="PRG-VIP-MAKKAH">VIP Makkah Package</option>
          </select>
          <textarea id="lr-notes" class="acc-filter-input sls-textarea" rows="2" placeholder="Notes / ملاحظات"></textarea>
          <div style="display:flex; justify-content:flex-end;">
            <button type="submit" class="acc-btn acc-btn-primary" data-i18n="sales_crm.lead_req_submit">إرسال الطلب للإدارة</button>
          </div>
        </form>
      </section>

      <section class="sls-card">
        <h2 class="sls-card-title" data-i18n="sales_crm.lead_req_list_title">طلبات الإضافة المرسلة (بانتظار الإدارة)</h2>
        <div class="sls-list" id="lr-list"></div>
      </section>
    </main>
  </div>

  <script src="./sales-workspace.js"></script>
  <script>
    (function () {
      var WS = window.SalesWorkspace;
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }
      async function loadRequests() {
        var res = await WS.apiFetch('/api/sales/lead-requests', { method: 'GET' });
        var items = res.items || [];
        document.getElementById('lr-list').innerHTML = items.length ? items.map(function (r) {
          return '<div class="sls-list-item">' +
            '<div class="sls-item-main"><span class="sls-item-title">' + esc(r.name_ar) + ' (<bdi dir="ltr">' + esc(r.phone) + '</bdi>)</span><span class="sls-item-meta">' + esc(r.requested_by_name_ar) + ' • <bdi dir="ltr">' + esc(new Date(r.created_at).toLocaleString()) + '</bdi></span></div>' +
            '<span class="status-pill status-pill-amber">' + esc(r.status) + '</span>' +
          '</div>';
        }).join('') : '<p class="sls-item-meta">—</p>';
      }
      document.addEventListener('DOMContentLoaded', async function () {
        await WS.init();
        await loadRequests();
        document.getElementById('lr-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          await WS.apiFetch('/api/sales/lead-requests', {
            method: 'POST',
            body: JSON.stringify({
              nameAr: document.getElementById('lr-name').value.trim(),
              phone: document.getElementById('lr-phone').value.trim(),
              whatsapp: document.getElementById('lr-wa').value.trim(),
              governorate: document.getElementById('lr-gov').value,
              programId: document.getElementById('lr-prog').value,
              notes: document.getElementById('lr-notes').value.trim()
            })
          });
          document.getElementById('lr-form').reset();
          var st = document.getElementById('lr-status');
          st.textContent = WS.t('lead_req_saved', 'Lead assignment request submitted to Admin (pending approval).');
          st.hidden = false;
          await loadRequests();
        });
      });
    })();
  </script>
</body>
</html>
