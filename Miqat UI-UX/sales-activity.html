<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل النشاط | ميقات للمبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap">
        <a href="sales-dashboard.html" class="acc-brand-link">
          <img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="40" height="40">
          <img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="40" height="40">
          <div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="sales_crm.brand_title">ميقات للمبيعات ومركز الاتصال</span></div>
        </a>
      </div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="sls-lang-switcher"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="sls-theme-toggle"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle></svg></button>
        <div class="acc-employee-card"><div class="acc-employee-avatar" id="sls-emp-avatar">أ</div><div class="acc-employee-info"><span class="acc-employee-name" id="sls-emp-name">أحمد صبري</span></div></div>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper">
    <main class="acc-main-content" id="main-content" role="main">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem;">
        <h1 class="acc-page-title" data-i18n="sales_crm.qa_view_activity">سجل النشاط الكامل</h1>
        <a href="sales-dashboard.html" class="acc-btn acc-btn-secondary" data-i18n="sales_crm.back_to_dashboard">العودة إلى لوحة التحكم</a>
      </div>
      <section class="sls-card">
        <div class="sls-list" id="activity-full-list"></div>
      </section>
    </main>
  </div>

  <script src="./sales-workspace.js"></script>
  <script>
    (function () {
      var WS = window.SalesWorkspace;
      async function load() {
        var res = await WS.apiFetch('/api/sales/activity', { method: 'GET' });
        var list = document.getElementById('activity-full-list');
        var items = res.items || [];
        list.innerHTML = items.length ? items.map(function (a) {
          var d = WS.getLang() === 'en' ? a.desc_en : a.desc_ar;
          return '<div class="sls-list-item"><div class="sls-item-main"><span class="sls-item-title">' + d + '</span><span class="sls-item-meta">' + a.source + ' • <bdi dir="ltr">' + a.created_at + '</bdi></span></div></div>';
        }).join('') : '<p class="sls-item-meta">' + WS.t('empty_activity') + '</p>';
      }
      document.addEventListener('DOMContentLoaded', async function () {
        await WS.init();
        await load();
        WS.onRefresh(load);
      });
    })();
  </script>
</body>
</html>
