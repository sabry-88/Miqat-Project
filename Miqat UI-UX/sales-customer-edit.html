<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعديل بيانات العميل | ميقات للمبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page">
  <a href="#main-content" class="skip-link" data-i18n="partner_hub.skip_link">تخطي إلى المحتوى الرئيسي</a>
  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap">
        <a href="sales-customers.html" class="acc-brand-link"><img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="40" height="40"><img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="40" height="40"><div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="sales_crm.brand_title">ميقات للمبيعات ومركز الاتصال</span></div></a>
      </div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="sls-lang-switcher" aria-label="Switch Language"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="sls-theme-toggle" aria-label="Switch Theme"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle></svg></button>
        <div class="acc-employee-card"><div class="acc-employee-avatar" id="sls-emp-avatar">أ</div><div class="acc-employee-info"><span class="acc-employee-name" id="sls-emp-name">أحمد صبري</span></div></div>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper" style="display:block;">
    <main class="acc-main-content" id="main-content" role="main" style="max-width:720px; margin-inline:auto;">
      <section class="sls-card" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <h1 class="acc-page-title" data-i18n="sales_crm.edit_cust_title">تعديل بيانات العميل</h1>
        <a id="edit-back-link" href="sales-customers.html" class="acc-btn acc-btn-secondary acc-btn-sm" data-i18n="sales_crm.back_to_customers">العودة</a>
      </section>
      <section class="sls-card">
        <div id="edit-status" class="sls-item-meta" role="status" hidden></div>
        <form id="edit-cust-form" style="display:flex; flex-direction:column; gap:0.85rem;">
          <div><label for="ed-name" class="sls-kpi-label" data-i18n="sales_crm.tbl_customer">العميل</label><input type="text" id="ed-name" class="acc-filter-input" required></div>
          <div><label for="ed-phone" class="sls-kpi-label" data-i18n="sales_crm.lbl_phone">الهاتف</label><input type="tel" id="ed-phone" class="acc-filter-input" required></div>
          <div><label for="ed-wa" class="sls-kpi-label">WhatsApp</label><input type="tel" id="ed-wa" class="acc-filter-input"></div>
          <div><label for="ed-gov" class="sls-kpi-label" data-i18n="sales_crm.lbl_gov">المحافظة</label><select id="ed-gov" class="acc-filter-select"><option value="cairo">Cairo / القاهرة</option><option value="portsaid">Port Said / بورسعيد</option><option value="other_gov">Other / محافظات أخرى</option><option value="overseas">Overseas / بالخارج</option></select></div>
          <div><label for="ed-ref" class="sls-kpi-label" data-i18n="sales_crm.src_referral">المرشح</label><input type="text" id="ed-ref" class="acc-filter-input"></div>
          <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
            <button type="submit" class="acc-btn acc-btn-primary" data-i18n="sales_crm.btn_save_changes">حفظ التعديلات</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="./sales-workspace.js"></script>
  <script>
    (function () {
      var WS = window.SalesWorkspace;
      var custId = new URLSearchParams(window.location.search).get('id') || 'CUS-D-101';
      var isDirty = false;
      window.addEventListener('beforeunload', function (e) { if (isDirty) { e.preventDefault(); e.returnValue = ''; } });
      document.addEventListener('DOMContentLoaded', async function () {
        await WS.init();
        document.getElementById('edit-back-link').href = 'sales-customer-details.html?id=' + encodeURIComponent(custId);
        var data = await WS.apiFetch('/api/sales/customers/' + encodeURIComponent(custId), { method: 'GET' });
        var c = data.customer;
        document.getElementById('ed-name').value = c.name_ar || c.name_en || '';
        document.getElementById('ed-phone').value = c.phone || '';
        document.getElementById('ed-wa').value = c.whatsapp || c.phone || '';
        document.getElementById('ed-gov').value = c.governorate || 'cairo';
        document.getElementById('ed-ref').value = c.referrer_name || '';
        document.getElementById('edit-cust-form').addEventListener('input', function () { isDirty = true; });
        document.getElementById('edit-cust-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          await WS.apiFetch('/api/sales/customers/' + encodeURIComponent(custId) + '/edit', {
            method: 'PATCH',
            body: JSON.stringify({
              nameAr: document.getElementById('ed-name').value.trim(),
              phone: document.getElementById('ed-phone').value.trim(),
              whatsapp: document.getElementById('ed-wa').value.trim(),
              governorate: document.getElementById('ed-gov').value,
              referrerName: document.getElementById('ed-ref').value.trim()
            })
          });
          isDirty = false;
          var st = document.getElementById('edit-status');
          st.textContent = WS.t('msg_saved', 'Saved successfully.');
          st.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
