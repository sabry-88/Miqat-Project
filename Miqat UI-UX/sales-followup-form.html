<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدولة متابعة | ميقات للمبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page">
  <a href="#main-content" class="skip-link" data-i18n="partner_hub.skip_link">تخطي إلى المحتوى الرئيسي</a>

  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap">
        <a href="sales-customers.html" class="acc-brand-link">
          <img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="40" height="40">
          <img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="40" height="40">
          <div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="sales_crm.brand_title">ميقات للمبيعات ومركز الاتصال</span></div>
        </a>
      </div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="sls-lang-switcher" aria-label="Switch Language"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="sls-theme-toggle" aria-label="Switch Theme"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle></svg></button>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper" style="display:block;">
    <main class="acc-main-content" id="main-content" role="main" style="max-width:700px; margin-inline:auto;">
      <div class="sls-card" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="acc-page-title" id="fup-page-heading" data-i18n="sales_crm.fup_page_title">جدولة متابعة عميل</h1>
          <p class="sls-card-desc" data-i18n="sales_crm.fup_reminder_note">سيتم تفعيل تذكير تلقائي قبل الموعد بـ ١٥ دقيقة عبر مركز الإشعارات.</p>
        </div>
        <a href="sales-followups.html" class="acc-btn acc-btn-secondary acc-btn-sm" data-i18n="sales_crm.fup_back_to_list">العودة للمتابعات</a>
      </div>

      <!-- Overdue Delay Reason Section (when ?overdueId=...) -->
      <section class="sls-card" id="overdue-card" hidden>
        <div id="overdue-status" class="sls-item-meta" role="status" hidden></div>
        <form id="overdue-form" style="display:flex; flex-direction:column; gap:0.85rem;">
          <label for="overdue-reason" class="sls-kpi-label" data-i18n="sales_crm.fup_delay_reason_lbl">سبب التأخير (إلزامي لنقل العميل إلى المتابعة بدون موعد)</label>
          <textarea id="overdue-reason" class="acc-filter-input sls-textarea" rows="3" required></textarea>
          <button type="submit" class="acc-btn acc-btn-primary" data-i18n="sales_crm.fup_process_overdue_btn">تسجيل التأخير ونقل العميل</button>
        </form>
      </section>

      <!-- Schedule / Edit / Reschedule Follow-up Form -->
      <section class="sls-card" id="schedule-card">
        <div id="fup-status" class="sls-item-meta" role="status" hidden></div>
        <div id="fup-error" class="sls-item-meta" role="alert" style="color:var(--color-warning); font-weight:600;" hidden></div>
        <form id="fup-form" style="display:flex; flex-direction:column; gap:0.9rem;">
          <div>
            <label for="fup-customer" class="sls-kpi-label" data-i18n="sales_crm.call_lbl_customer">العميل</label>
            <select id="fup-customer" class="acc-filter-select" style="margin-block-start:0.35rem;"></select>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
            <button type="button" class="acc-chip-btn" data-quick-fup="15m" data-i18n="sales_crm.quick_15m">+١٥ دقيقة</button>
            <button type="button" class="acc-chip-btn" data-quick-fup="30m" data-i18n="sales_crm.quick_30m">+٣٠ دقيقة</button>
            <button type="button" class="acc-chip-btn" data-quick-fup="1h" data-i18n="sales_crm.quick_1h">+١ ساعة</button>
            <button type="button" class="acc-chip-btn" data-quick-fup="tom10" data-i18n="sales_crm.quick_tom10">غداً ١٠:٠٠ ص</button>
            <button type="button" class="acc-chip-btn" data-quick-fup="2d" data-i18n="sales_crm.quick_2d">+٢ يوم</button>
            <button type="button" class="acc-chip-btn" data-quick-fup="7d" data-i18n="sales_crm.quick_7d">+٧ أيام</button>
          </div>
          <div>
            <label for="fup-due" class="sls-kpi-label" data-i18n="sales_crm.fup_lbl_due">موعد المتابعة</label>
            <input type="datetime-local" id="fup-due" class="acc-filter-input" required style="margin-block-start:0.35rem;">
            <label style="display:flex; align-items:center; gap:0.45rem; margin-block-start:0.5rem; font-size:0.86rem;">
              <input type="checkbox" id="fup-undated">
              <span data-i18n="sales_crm.fup_undated_chk">متابعة غير مؤرخة (مرنة)</span>
            </label>
          </div>
          <div>
            <label for="fup-purpose" class="sls-kpi-label" data-i18n="sales_crm.fup_lbl_purpose">الغرض من المتابعة</label>
            <input type="text" id="fup-purpose" class="acc-filter-input" style="margin-block-start:0.35rem;">
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0.75rem;">
            <div>
              <label for="fup-priority" class="sls-kpi-label" data-i18n="sales_crm.fup_lbl_priority">الأولوية</label>
              <select id="fup-priority" class="acc-filter-select" style="margin-block-start:0.35rem;">
                <option value="normal" data-i18n="sales_crm.prio_normal">عادي</option>
                <option value="high" data-i18n="sales_crm.prio_high">مرتفع</option>
                <option value="urgent" data-i18n="sales_crm.prio_urgent">عاجل</option>
              </select>
            </div>
            <div>
              <label for="fup-recurrence" class="sls-kpi-label" data-i18n="sales_crm.fup_recurrence">التكرار</label>
              <select id="fup-recurrence" class="acc-filter-select" style="margin-block-start:0.35rem;">
                <option value="" data-i18n="sales_crm.fup_recurrence_none">بدون تكرار</option>
                <option value="weekly" data-i18n="sales_crm.fup_recurrence_weekly">أسبوعي</option>
                <option value="monthly" data-i18n="sales_crm.fup_recurrence_monthly">شهري</option>
              </select>
            </div>
          </div>
          <div>
            <label for="fup-notes" class="sls-kpi-label" data-i18n="sales_crm.fup_lbl_notes">ملاحظات المتابعة</label>
            <textarea id="fup-notes" class="acc-filter-input sls-textarea" rows="3" style="margin-block-start:0.35rem;"></textarea>
          </div>
          <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
            <button type="submit" class="acc-btn acc-btn-primary" data-i18n="sales_crm.fup_submit">حفظ المتابعة</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="./sales-workspace.js"></script>
  <script>
    (function () {
      var WS = window.SalesWorkspace;
      document.addEventListener('DOMContentLoaded', async function () {
        await WS.init();
        var params = new URLSearchParams(window.location.search);
        var overdueId = params.get('overdueId');
        var rescheduleId = params.get('rescheduleId');
        var editId = params.get('editId');

        if (overdueId) {
          document.getElementById('overdue-card').hidden = false;
          document.getElementById('schedule-card').hidden = true;
          document.getElementById('overdue-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            await WS.apiFetch('/api/sales/followups/' + encodeURIComponent(overdueId) + '/overdue', {
              method: 'PATCH',
              body: JSON.stringify({ delayReason: document.getElementById('overdue-reason').value.trim() })
            });
            var st = document.getElementById('overdue-status');
            st.textContent = WS.t('fup_overdue_saved', 'Overdue processed; customer moved to Follow without Due Date.');
            st.hidden = false;
          });
          return;
        }

        var dash = await WS.apiFetch('/api/sales/dashboard?period=month', { method: 'GET' });
        var sel = document.getElementById('fup-customer');
        sel.innerHTML = (dash.customersOptions || []).map(function (c) {
          var name = WS.getLang() === 'en' ? c.name_en : c.name_ar;
          return '<option value="' + c.id + '">' + name + '</option>';
        }).join('');
        var custParam = params.get('customerId');
        if (custParam) sel.value = custParam;

        var undatedChk = document.getElementById('fup-undated');
        var dueInput = document.getElementById('fup-due');
        undatedChk.addEventListener('change', function () {
          dueInput.required = !undatedChk.checked;
          dueInput.disabled = undatedChk.checked;
        });

        if (editId) {
          document.getElementById('fup-page-heading').textContent = WS.t('fup_edit_title', 'تعديل المتابعة');
          try {
            var existing = await WS.apiFetch('/api/sales/followups/' + encodeURIComponent(editId), { method: 'GET' });
            if (existing && existing.followup) {
              var ef = existing.followup;
              sel.value = String(ef.customer_id);
              sel.disabled = true;
              undatedChk.checked = Boolean(ef.undated);
              dueInput.disabled = undatedChk.checked;
              dueInput.required = !undatedChk.checked;
              if (ef.due_at && !ef.undated) {
                var dt = new Date(ef.due_at);
                if (!Number.isNaN(dt.getTime())) {
                  dueInput.value = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                }
              }
              document.getElementById('fup-purpose').value = ef.purpose || '';
              document.getElementById('fup-priority').value = ef.priority || 'normal';
              document.getElementById('fup-recurrence').value = ef.recurrence_rule || '';
              document.getElementById('fup-notes').value = ef.notes || '';
            }
          } catch (_) {}
        }

        document.querySelectorAll('[data-quick-fup]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var kind = btn.getAttribute('data-quick-fup');
            var d = new Date();
            if (kind === '15m') d = new Date(d.getTime() + 15 * 60000);
            else if (kind === '30m') d = new Date(d.getTime() + 30 * 60000);
            else if (kind === '1h') d = new Date(d.getTime() + 3600000);
            else if (kind === 'tom10') { d.setDate(d.getDate() + 1); d.setHours(10, 0, 0, 0); }
            else if (kind === '2d') d.setDate(d.getDate() + 2);
            else if (kind === '7d') d.setDate(d.getDate() + 7);
            dueInput.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            undatedChk.checked = false;
            dueInput.disabled = false;
          });
        });

        document.getElementById('fup-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          var errEl = document.getElementById('fup-error');
          var st = document.getElementById('fup-status');
          errEl.hidden = true;
          st.hidden = true;
          var dueVal = dueInput.value;
          try {
            if (editId) {
              await WS.apiFetch('/api/sales/followups/' + encodeURIComponent(editId), {
                method: 'PATCH',
                body: JSON.stringify({
                  undated: undatedChk.checked,
                  dueAt: (!undatedChk.checked && dueVal) ? new Date(dueVal).toISOString() : '',
                  purpose: document.getElementById('fup-purpose').value.trim(),
                  priority: document.getElementById('fup-priority').value,
                  recurrenceRule: document.getElementById('fup-recurrence').value,
                  notes: document.getElementById('fup-notes').value.trim()
                })
              });
            } else {
              await WS.apiFetch('/api/sales/followups', {
                method: 'POST',
                body: JSON.stringify({
                  customerId: sel.value,
                  undated: undatedChk.checked,
                  dueAt: (!undatedChk.checked && dueVal) ? new Date(dueVal).toISOString() : '',
                  purpose: document.getElementById('fup-purpose').value.trim(),
                  priority: document.getElementById('fup-priority').value,
                  recurrenceRule: document.getElementById('fup-recurrence').value,
                  notes: document.getElementById('fup-notes').value.trim(),
                  rescheduleFromId: rescheduleId || ''
                })
              });
            }
            st.textContent = WS.t('fup_saved');
            st.hidden = false;
          } catch (err) {
            errEl.textContent = (err && err.message && err.message.indexOf('DUPLICATE') !== -1)
              ? WS.t('fup_duplicate_error', 'يوجد موعد متابعة مسجل مسبقاً لهذا العميل في نفس الوقت.')
              : (err && err.message ? err.message : 'Error');
            errEl.hidden = false;
          }
        });
      });
    })();
  </script>
</body>
</html>
