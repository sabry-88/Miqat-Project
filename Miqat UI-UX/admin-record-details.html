<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل السجل | مركز تحكم ميقات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page admin-workspace-page adm-cc-page">
  <a href="#main-content" class="skip-link" data-i18n="partner_hub.skip_link">تخطي إلى المحتوى الرئيسي</a>

  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap">
        <button type="button" class="acc-hamburger-btn" id="acc-hamburger-btn" aria-label="Open menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <a href="admin-control-center.html" class="acc-brand-link">
          <img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="38" height="38">
          <img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="38" height="38">
          <div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="admin_cc.brand_title">مركز تحكم ميقات</span></div>
        </a>
      </div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="adm-lang-switcher" aria-label="Switch Language"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="adm-theme-toggle" aria-label="Switch Theme">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <div class="acc-employee-card">
          <div class="acc-employee-avatar" id="adm-owner-avatar">م</div>
          <div class="acc-employee-info"><span class="acc-employee-name" id="adm-owner-name">مدير النظام</span></div>
        </div>
        <button type="button" class="acc-logout-btn" id="adm-logout-btn"><span class="acc-logout-btn-text" data-i18n="admin_cc.btn_logout">تسجيل الخروج</span></button>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper">
    <div class="acc-drawer-backdrop" id="acc-drawer-backdrop" aria-hidden="true"></div>
    <aside class="acc-sidebar adm-sidebar" id="acc-sidebar">
      <div class="acc-sidebar-header">
        <span class="acc-sidebar-title" data-i18n="admin_cc.brand_title">مركز تحكم ميقات</span>
        <button type="button" class="acc-drawer-close-btn" id="acc-drawer-close-btn" aria-label="Close menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <nav class="acc-sidebar-nav" aria-label="Admin Navigation">
        <a href="admin-control-center.html" class="acc-nav-item is-active" aria-current="page"><div class="acc-nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg></div><span class="acc-nav-label" data-i18n="admin_cc.nav_control_center">مركز تحكم ميقات</span></a>
        <a href="admin-transactions.html" class="acc-nav-item"><div class="acc-nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg></div><span class="acc-nav-label" data-i18n="admin_cc.nav_payments_backup">سجلات الدفع والنسخ الاحتياطي</span></a>
      </nav>
    </aside>

    <main class="acc-main-content" id="main-content" role="main">
      <nav aria-label="Breadcrumb" class="sls-breadcrumb">
        <a href="admin-control-center.html" data-i18n="admin_cc.nav_control_center">مركز تحكم ميقات</a>
        <span aria-hidden="true">/</span>
        <span id="rd-breadcrumb"></span>
      </nav>

      <section class="sls-card" id="rd-body"></section>
    </main>
  </div>

  <dialog id="adm-logout-dialog" class="sls-dialog adm-confirm-modal" aria-labelledby="adm-logout-title">
    <div class="adm-dialog-head">
      <div class="adm-dialog-title-wrap">
        <span class="adm-dialog-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </span>
        <h2 id="adm-logout-title" class="sls-card-title" data-i18n="admin_cc.logout_confirm_title">تأكيد تسجيل الخروج</h2>
      </div>
    </div>
    <div class="adm-dialog-body">
      <p class="sls-card-desc" data-i18n="admin_cc.logout_confirm_body">هل تريد تسجيل الخروج من لوحة الإدارة؟</p>
    </div>
    <form method="dialog" class="adm-dialog-actions">
      <button type="submit" value="cancel" class="acc-btn acc-btn-secondary" autofocus data-i18n="admin_cc.btn_cancel">إلغاء</button>
      <button type="submit" value="confirm" class="acc-btn acc-btn-primary" data-i18n="admin_cc.btn_logout">تسجيل الخروج</button>
    </form>
  </dialog>

  <script src="./admin-workspace.js"></script>
  <script src="./admin-control-data.js"></script>
  <script>
    (function () {
      'use strict';
      var AW = window.AdminWorkspace;
      var D = window.AdminControlData;
      var params = new URLSearchParams(window.location.search);
      var type = params.get('type') || 'company';
      var id = params.get('id') || '';
      var view = params.get('view') || 'daily_ops';
      var range = params.get('range') || 'weekly';

      function render() {
        var en = AW.isEn();
        var body = document.getElementById('rd-body');
        var typeLabels = {
          geo: en ? 'GEO' : 'التوزيع الجغرافي',
          company: en ? 'COMPANY' : 'شركة',
          employee: en ? 'EMPLOYEE' : 'موظف',
          customer: en ? 'CUSTOMER' : 'عميل',
          request: en ? 'REQUEST' : 'طلب'
        };
        document.getElementById('rd-breadcrumb').textContent = (typeLabels[type] || type.toUpperCase()) + (id ? ' / ' + id : '');
        var backBtn = '<a href="admin-control-center.html" class="acc-btn acc-btn-secondary acc-btn-sm">' + AW.esc(en ? 'Return to Control Center' : 'العودة لمركز التحكم') + '</a>';
        var ctxNote = '<span class="sls-item-meta">' + AW.esc((en ? 'Preserved Context: View=' : 'السياق المحفوظ: العرض=') + view + ' • Range=' + range) + '</span>';

        if (type === 'geo') {
          var govs = {};
          D.CUSTOMERS.forEach(function (c) { govs[c.gov] = (govs[c.gov] || 0) + 1; });
          body.innerHTML =
            '<div class="adm-cmd-top"><div><h1 class="acc-page-title">' + AW.esc(en ? 'Geographic Distribution Analytics' : 'تحليل التوزيع الجغرافي للعملاء') + '</h1>' + ctxNote + '</div>' + backBtn + '</div>' +
            '<div class="sls-geo-grid">' +
              Object.keys(govs).map(function (g) {
                return '<div class="sls-geo-tile"><strong>' + AW.esc(g.toUpperCase()) + '</strong><span class="sls-kpi-val"><bdi dir="ltr">' + AW.formatNumber(govs[g]) + '</bdi></span></div>';
              }).join('') +
            '</div>';
          return;
        }

        if (type === 'company') {
          var comp = D.COMPANIES.find(function (c) { return c.id === id; }) || D.COMPANIES[0];
          body.innerHTML =
            '<div class="adm-cmd-top"><div><h1 class="acc-page-title">' + AW.esc(en ? comp.name_en : comp.name_ar) + '</h1>' + ctxNote + '</div>' + backBtn + '</div>' +
            '<dl class="sls-detail-grid">' +
              '<div><dt>' + AW.esc(en ? 'ID' : 'المعرّف') + '</dt><dd><bdi dir="ltr">' + AW.esc(comp.id) + '</bdi></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Status' : 'الحالة') + '</dt><dd><span class="status-pill status-pill-amber">' + AW.esc(comp.status) + '</span></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'City' : 'المدينة') + '</dt><dd>' + AW.esc(en ? comp.city_en : comp.city_ar) + '</dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Bookings / Contracts' : 'الحجوزات / العقود') + '</dt><dd><bdi dir="ltr">' + AW.formatNumber(comp.bookings) + ' / ' + AW.formatNumber(comp.completed_contracts) + '</bdi></dd></div>' +
            '</dl>';
          return;
        }

        if (type === 'employee') {
          var emp = D.SALES_EMPLOYEES.find(function (e) { return e.id === id; }) || D.SALES_EMPLOYEES[0];
          body.innerHTML =
            '<div class="adm-cmd-top"><div><h1 class="acc-page-title">' + AW.esc(en ? emp.name_en : emp.name_ar) + '</h1>' + ctxNote + '</div>' + backBtn + '</div>' +
            '<dl class="sls-detail-grid">' +
              '<div><dt>' + AW.esc(en ? 'Status' : 'الحالة') + '</dt><dd>' + AW.esc(emp.status) + '</dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Completed Contracts' : 'العقود المكتملة') + '</dt><dd><bdi dir="ltr">' + AW.formatNumber(emp.completed_contracts) + '</bdi></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Conversion' : 'نسبة التحويل') + '</dt><dd><bdi dir="ltr">' + AW.formatNumber(emp.conversion_pct) + '%</bdi></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Latest Activity' : 'آخر نشاط') + '</dt><dd>' + AW.esc(en ? emp.latest_interaction_en : emp.latest_interaction_ar) + '</dd></div>' +
            '</dl>';
          return;
        }

        if (type === 'request') {
          var req = D.EMP_TO_COMPANY_REQUESTS.find(function (r) { return r.id === id; }) || D.EMP_TO_COMPANY_REQUESTS[0];
          body.innerHTML =
            '<div class="adm-cmd-top"><div><h1 class="acc-page-title">' + AW.esc(en ? req.subject_en : req.subject_ar) + '</h1>' + ctxNote + '</div>' + backBtn + '</div>' +
            '<dl class="sls-detail-grid">' +
              '<div><dt>' + AW.esc(en ? 'Request ID' : 'رقم الطلب') + '</dt><dd><bdi dir="ltr">' + AW.esc(req.id) + '</bdi></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Status' : 'الحالة') + '</dt><dd>' + AW.esc(req.status) + '</dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Wait Time' : 'مدة الانتظار') + '</dt><dd><bdi dir="ltr">' + AW.formatNumber(req.wait_hours) + 'h</bdi></dd></div>' +
              '<div><dt>' + AW.esc(en ? 'Company ID' : 'الشركة') + '</dt><dd><bdi dir="ltr">' + AW.esc(req.company_id) + '</bdi></dd></div>' +
            '</dl>';
          return;
        }

        var cust = D.CUSTOMERS.find(function (c) { return c.id === id || c.stage === id; }) || D.CUSTOMERS[0];
        body.innerHTML =
          '<div class="adm-cmd-top"><div><h1 class="acc-page-title">' + AW.esc(en ? cust.name_en : cust.name_ar) + '</h1>' + ctxNote + '</div>' + backBtn + '</div>' +
          '<dl class="sls-detail-grid">' +
            '<div><dt>' + AW.esc(en ? 'ID' : 'المعرّف') + '</dt><dd><bdi dir="ltr">' + AW.esc(cust.id) + '</bdi></dd></div>' +
            '<div><dt>' + AW.esc(en ? 'Stage' : 'المرحلة') + '</dt><dd>' + AW.esc(cust.stage) + '</dd></div>' +
            '<div><dt>' + AW.esc(en ? 'Program' : 'البرنامج') + '</dt><dd>' + AW.esc(en ? cust.program_en : cust.program_ar) + '</dd></div>' +
            '<div><dt>' + AW.esc(en ? 'Operational Status' : 'الحالة التشغيلية') + '</dt><dd>' + AW.esc(cust.payment_incomplete ? (en ? 'Payment Incomplete (Status)' : 'غير مكتمل السداد (حالة)') : (en ? 'Up to date' : 'محدّث')) + '</dd></div>' +
          '</dl>';
      }

      document.addEventListener('DOMContentLoaded', async function () {
        try { await AW.init(); } catch (_) { return; }
        render();
        AW.onRefresh(render);
      });
    })();
  </script>
</body>
</html>
