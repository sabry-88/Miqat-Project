<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلغاء العميل | ميقات للمبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" href="./assets/Miqat Logo Transparent.png">
</head>
<body class="accounts-workspace-page sales-workspace-page">
  <a href="#main-content" class="skip-link" data-i18n="partner_hub.skip_link">تخطي إلى المحتوى الرئيسي</a>
  <header class="acc-header" role="banner">
    <div class="acc-header-inner">
      <div class="acc-header-brand-wrap"><a href="sales-customers.html" class="acc-brand-link"><img src="./assets/Miqat Logo Transparent.png" alt="Miqat" class="acc-brand-logo logo-light" width="40" height="40"><img src="./assets/Miqat Logo Dark.png" alt="Miqat" class="acc-brand-logo logo-dark" width="40" height="40"><div class="acc-brand-text-wrap"><span class="acc-brand-name" data-i18n="sales_crm.brand_title">ميقات للمبيعات ومركز الاتصال</span></div></a></div>
      <div class="acc-header-actions">
        <button type="button" class="acc-icon-btn acc-lang-btn" id="sls-lang-switcher" aria-label="Switch Language"><span class="lang-btn-text">EN</span></button>
        <button type="button" class="acc-icon-btn acc-theme-btn" id="sls-theme-toggle" aria-label="Switch Theme"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle></svg></button>
      </div>
    </div>
  </header>

  <div class="acc-layout-wrapper" style="display:block;">
    <main class="acc-main-content" id="main-content" role="main" style="max-width:680px; margin-inline:auto;">
      <section class="sls-card" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <h1 class="acc-page-title" data-i18n="sales_crm.cancel_page_title">إلغاء متابعة العميل</h1>
        <a id="cancel-back" href="sales-customers.html" class="acc-btn acc-btn-secondary acc-btn-sm" data-i18n="sales_crm.back_to_customers">العودة</a>
      </section>
      <section class="sls-card">
        <div id="cancel-cust-name" style="font-weight:700;"></div>
        <div id="cancel-status" class="sls-item-meta" role="status" hidden></div>
        <form id="cancel-form" style="display:flex; flex-direction:column; gap:0.9rem;">
          <div>
            <label for="cancel-reason" class="sls-kpi-label" data-i18n="sales_crm.cancel_reason_lbl">سبب الإلغاء المعتمد</label>
            <select id="cancel-reason" class="acc-filter-select" required style="margin-block-start:0.35rem;">
              <option value="low_budget" data-i18n="sales_crm.cancel_low_budget">الميزانية غير مناسبة</option>
              <option value="not_interested" data-i18n="sales_crm.cancel_not_interested">غير مهتم</option>
              <option value="not_registered_campaign" data-i18n="sales_crm.cancel_not_registered">لم يسجل عبر الحملة</option>
              <option value="inappropriate_behavior" data-i18n="sales_crm.cancel_inappropriate">أسلوب غير لائق</option>
              <option value="other" data-i18n="sales_crm.cancel_other">أسباب أخرى</option>
            </select>
          </div>
          <div id="cancel-other-wrap" hidden>
            <label for="cancel-other-note" class="sls-kpi-label" data-i18n="sales_crm.cancel_other_explain">توضيح السبب (إلزامي)</label>
            <textarea id="cancel-other-note" class="acc-filter-input sls-textarea" rows="3" style="margin-block-start:0.35rem;"></textarea>
          </div>
          <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
            <button type="submit" class="acc-btn acc-btn-primary" data-i18n="sales_crm.cancel_confirm_btn">تأكيد الإلغاء</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="./sales-workspace.js"></script>
  <script>
    (function () {
      var WS = window.SalesWorkspace;
      var custId = new URLSearchParams(window.location.search).get('id') || 'CUS-D-101';
      document.addEventListener('DOMContentLoaded', async function () {
        await WS.init();
        document.getElementById('cancel-back').href = 'sales-customer-details.html?id=' + encodeURIComponent(custId);
        var data = await WS.apiFetch('/api/sales/customers/' + encodeURIComponent(custId), { method: 'GET' });
        document.getElementById('cancel-cust-name').textContent = WS.getLang() === 'en' ? data.customer.name_en : data.customer.name_ar;

        var reasonSel = document.getElementById('cancel-reason');
        var otherWrap = document.getElementById('cancel-other-wrap');
        var otherNote = document.getElementById('cancel-other-note');
        reasonSel.addEventListener('change', function () {
          var isOther = reasonSel.value === 'other';
          otherWrap.hidden = !isOther;
          otherNote.required = isOther;
        });

        document.getElementById('cancel-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          await WS.apiFetch('/api/sales/customers/' + encodeURIComponent(custId) + '/cancel', {
            method: 'POST',
            body: JSON.stringify({ reason: reasonSel.value, otherNote: otherNote.value.trim() })
          });
          var st = document.getElementById('cancel-status');
          st.textContent = WS.t('cancel_saved', 'Customer moved to cancellation group.');
          st.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
